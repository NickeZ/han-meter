[workspace]
members = ["crates/han-core", "crates/han-mqtt", "crates/han-config", "crates/han-logs", "firmware"]
default-members = ["crates/han-core", "crates/han-mqtt", "crates/han-config", "crates/han-logs"]
exclude = ["vendor/smoltcp"]
resolver = "3"

[patch.crates-io]
# Backport the dual-stack SLAAC route fix; see vendor/smoltcp/PATCHES.md.
smoltcp = { path = "vendor/smoltcp" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
