[workspace]
members = ["crates/han-core", "crates/han-mqtt", "crates/han-config", "firmware"]
default-members = ["crates/han-core", "crates/han-mqtt", "crates/han-config"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
