[package]
name = "han-firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "han-meter"
path = "src/main.rs"
test = false
bench = false

[dependencies]
han-core = { path = "../crates/han-core" }
han-mqtt = { path = "../crates/han-mqtt" }
han-config = { path = "../crates/han-config" }
han-logs = { path = "../crates/han-logs", features = ["tls"] }
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
# RSA's lazy initialization needs CAS emulation on the ESP32-C3 (RV32IMC).
spin = { version = "=0.9.9", default-features = false, features = ["portable_atomic"] }
esp-storage = { version = "=0.10.0", features = ["esp32c3", "embedded-storage"] }
embedded-storage = "0.3.1"
picoserve = { version = "=0.19.0", default-features = false, features = ["embassy", "json"] }
esp-hal = { version = "=1.2.2", features = ["esp32c3", "unstable"] }
# These releases include the RISC-V idle scheduler and Wi-Fi cancellation fixes.
esp-rtos = { version = "=0.4.0", features = ["esp32c3", "embassy", "esp-radio", "esp-alloc"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32c3", "wifi", "unstable"] }
esp-alloc = { version = "=0.11.0", features = ["esp32c3"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32c3"] }
esp-println = { version = "=0.18.0", default-features = false, features = ["esp32c3", "jtag-serial", "critical-section"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32c3", "panic-handler", "println"] }
embassy-executor = "=0.10.0"
embassy-net = { version = "=0.9.1", features = ["tcp", "udp", "dhcpv4-hostname", "dns", "medium-ethernet", "slaac"] }
# IPv4, SLAAC, and IPv6 link-local must coexist; retain multiple DNS answers.
smoltcp = { version = "=0.13.1", default-features = false, features = ["iface-max-addr-count-3", "dns-max-result-count-4"] }
heapless = "=0.9.1"
embassy-time = "=0.5.1"
embassy-sync = "=0.8.0"
static_cell = "=2.1.1"

[build-dependencies]
base64 = "=0.23.1"
han-config = { path = "../crates/han-config", default-features = false }
han-logs = { path = "../crates/han-logs" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
