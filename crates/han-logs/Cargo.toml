[package]
name = "han-logs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
tls = ["dep:embedded-tls", "dep:embassy-crypto-rustcrypto"]

[dependencies]
han-config = { path = "../han-config", default-features = false }
heapless = "=0.9.1"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "=0.6.0"
base64 = { version = "=0.23.1", default-features = false }
embedded-io-async = "=0.7.0"
# Upstream main as of 2026-10-27; includes no_std WebPKI chain verification.
embedded-tls = { git = "https://github.com/embassy-rs/embedded-tls", rev = "6487c62bb084c33361822022e21836ddfd48388f", optional = true, default-features = false, features = ["webpki", "p256", "p384", "rsa"] }
# Match embedded-tls's embassy-crypto revision so global crypto drivers agree.
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1", optional = true, features = ["embassy-crypto-sha256", "embassy-crypto-sha384", "embassy-crypto-sha512", "embassy-crypto-hmac-sha256", "embassy-crypto-aes128-gcm", "embassy-crypto-p256-ecdh", "embassy-crypto-p256-ecdsa", "embassy-crypto-p384-ecdh", "embassy-crypto-p384-ecdsa"] }

[dev-dependencies]
embassy-sync = "=0.8.0"
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
embedded-io-adapters = { version = "=0.7.0", features = ["tokio-1"] }
critical-section = { version = "1.2", features = ["std"] }
embassy-crypto-rand = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
tempfile = "3"
