[package]
name = "han-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["web"]
web = ["dep:picoserve"]

[dependencies]
heapless = { version = "=0.9.1", features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "=0.6.0"
embedded-storage = "0.3.1"
embassy-sync = "=0.8.0"
embassy-futures = "=0.1.2"
picoserve = { version = "=0.19.0", default-features = false, features = ["json"], optional = true }

[dev-dependencies]
picoserve = { version = "=0.19.0", features = ["tokio", "json"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "sync", "io-util"] }
serde_json = "1.0"

