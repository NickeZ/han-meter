[alias]
firmware = "build --release --locked -p han-firmware --target riscv32imc-unknown-none-elf"
flash = "run --release --locked -p han-firmware --target riscv32imc-unknown-none-elf"

[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c3"
rustflags = ["-C", "force-frame-pointers"]
