# Copy to config.toml (ignored by Git) and edit before flashing.
device_name = "HAN meter"

[wifi]
ssid = "CHANGE_ME"
password = "CHANGE_ME"

[mqtt]
# Initial defaults. Saved settings from http://<device-ip>/ override these,
# including after reflashing. Leave the browser password empty to keep it.
# IPv4/IPv6 address or DNS hostname; .local/mDNS is not supported.
# IPv6 examples: "fd12:3456:789a::10" or "[fd12:3456:789a::10]"; no zone ID.
# On IPv6-only networks use an address: DNS servers are learned via DHCPv4.
host = "mqtt.example.net"
port = 1883
username = "han-meter"
password = "CHANGE_ME"

# Optional HTTPS log delivery. Remove the leading # to enable.
# Use the exact ingest URL, including any reverse-proxy path/query parameters.
# Let’s Encrypt ISRG Root X1/X2 are included; send the full chain and allow TLS 1.3.
# HTTPS hostnames are limited to 64 bytes by the certificate verifier.
# [victorialogs]
# url = "https://logs.example.net/insert/jsonline"
# username = "han-meter"
# password = "CHANGE_ME"
# ntp_server = "pool.ntp.org"
